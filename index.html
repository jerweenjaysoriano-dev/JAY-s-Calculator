<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JAY JAY's Calculator</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <h1>Calculator</h1>

  <input type="text" id="name" placeholder="Enter your name"><br><br>
  <button onclick="ENTER()">ENTER</button>

  <hr>

  <input type="number" id="num1" placeholder="Enter first number">
  <input type="number" id="num2" placeholder="Enter second number"><br><br>

  <button onclick="addNumbers()">Add</button>
  <button onclick="subtractNumbers()">Subtract</button>
  <button onclick="multiplyNumbers()">Multiply</button>
  <button onclick="divideNumbers()">Divide</button>

  <p id="result"></p>

  <script src="assets/js/script.js"></script>
</body>
</html>
